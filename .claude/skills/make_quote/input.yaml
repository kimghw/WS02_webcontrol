# =====================================================================
# make_quote — 견적서 추출 스키마 (SSOT)
# ---------------------------------------------------------------------
# 이 파일이 "무엇을 · 어떤 구조로 · 어떻게 뽑을지" 를 정한다.
#   · 코드 에이전트: 원본(장바구니 캡처·주문서·공급자 견적서 이미지, 복사한 텍스트, HTML)을 보고
#     각 키의 prompt 대로 값을 뽑아 **이 파일과 같은 키 구조의 JSON** 을 만든다.
#   · scripts/make_quote.py: 이 파일로 그 JSON 을 검증(validate)하고 견적서로 렌더(render)한다.
#
# 키 하나 = 정의 하나. 정의에 쓰는 속성:
#   type      string | int | money | bool | date | url | enum | list | object
#   required  true 면 null 불가 (기본 false)
#   default   비어 있을 때 스크립트가 채우는 값. 자리표시자: {today}=오늘 YYYY-MM-DD,
#             {date}=견적일(quote_date) YYYYMMDD, {seq}=같은 날 견적 일련번호 2자리
#   label     렌더(표 헤더·행 이름)에 쓰는 표시 이름
#   values    enum 허용값. 리스트 또는 {값: 표시이름} 매핑
#   prompt    ★ 추출 지시(인라인). 원본에서 이 키를 어디서 찾고, 무엇을 넣고, 무엇을 빼는지.
#             `prompt: >-` 다음 줄에 들여써서 쓴다(그래야 ': ' 나 따옴표가 들어가도 YAML 이 깨지지 않는다).
#             여러 줄 그대로 두고 싶으면 `prompt: |`.
#   example   참고용 예시값(추출 대상 아님)
#   min       list 의 최소 항목 수
#
# 키를 추가하려면 type·label·prompt 를 반드시 같이 쓴다. 키를 지우면 검증·렌더에서도 사라진다.
# JSON 쪽에서 `_` 로 시작하는 키(예 "_source")는 메모용으로 검증에서 무시한다.
# =====================================================================

version: 1

# ---------------------------------------------------------------------
# 전체 추출 원칙 — 아래 모든 키의 prompt 에 앞서 항상 적용
# ---------------------------------------------------------------------
extraction:
  prompt: |
    원본은 온라인 쇼핑몰 장바구니 화면, 주문서/주문내역, 공급자 견적서 중 하나다.
    1. 원본에 보이는 값만 쓴다. 안 보이면 null. 추측·보정·환산하지 않는다.
    2. 금액은 숫자만 쓴다(원·₩·쉼표·공백 제거, "8,800원" → 8800). 통화가 원화가 아니면 meta.currency 에 적고 숫자는 그대로.
    3. 선택(체크)된 상품만 견적 대상이다. 체크 해제·품절·"함께 보면 좋은"·추천·광고·최근 본 상품 영역은 제외한다.
    4. 탭이 여러 개(예: "일반배송 1 | 지금배달 1")면 지금 표시 중인 탭만 뽑고, 다른 탭은 meta.note 에 "<탭이름> N건 미포함" 으로 남긴다.
    5. 같은 장바구니를 여러 장 캡처했으면 하나로 합친다. name+option 이 같은 항목은 중복이므로 한 번만 넣는다.
    6. 원본이 견적서/주문서라면 장바구니와 같은 키로 맞춘다(공급자→vendor, 품명→name, 규격/모델→option, 공급가액→subtotal).
    7. 글자가 잘리거나 흐려 판단이 갈리는 값은 가장 그럴듯한 값을 넣고 meta.note 에 "확인 필요: <무엇>" 을 적는다.
    8. 견적서에 필요 없는 것은 어디에도 넣지 않는다: 결제수단 배지(N pay), 마케팅 문구(쿠폰받기·선물가능상품·NEW·BEST),
       계정 닉네임, 알림 개수, 상세 주소·전화번호 같은 개인정보.

# ---------------------------------------------------------------------
# 키 정의
# ---------------------------------------------------------------------
fields:

  meta:
    type: object
    required: true
    label: 견적 정보
    prompt: >-
      견적서 머리에 들어갈 정보. 원본 상단(플랫폼 로고·탭·배송지·스토어 헤더)과 사용자가 함께 말한 맥락에서 뽑는다.
    fields:

      title:
        type: string
        default: 견적서
        label: 제목
        prompt: >-
          문서 제목. 원본에 "견적서"·"Quotation"·"발주서" 같은 제목이 있으면 그것. 장바구니·주문서면 null(기본값 "견적서" 로 채워진다).

      quote_no:
        type: string
        default: "Q-{date}-{seq}"
        label: 견적번호
        prompt: >-
          원본이 견적서면 그 문서의 번호(No., 견적번호, Ref, Quote #). 장바구니·주문서면 null 로 두어 기본값이 채워지게 한다. 주문번호를 견적번호로 쓰지 않는다.
        example: "Q-20260930-01"

      quote_date:
        type: date
        default: "{today}"
        label: 견적일
        prompt: >-
          원본에 견적일·작성일·발행일이 있으면 YYYY-MM-DD 로. 장바구니는 null(오늘 날짜로 채워진다). "2026.9.30"·"26/09/30" 같은 표기는 연-월-일로
          바꾼다.

      valid_until:
        type: date
        label: 유효기간
        prompt: >-
          견적 유효일(유효기간·Valid until). 장바구니면 null. "견적일로부터 30일" 같은 상대 표현이면 계산하지 말고 null 로 두고 meta.note 에 원문을 적는다.

      source_type:
        type: enum
        required: true
        values: {cart: 장바구니, order: 주문서, quotation: 견적서, other: 기타}
        label: 원본 종류
        prompt: >-
          장바구니 화면=cart, 주문서·주문내역·결제 화면=order, 공급자가 보낸 견적서=quotation, 그 외=other.

      source_platform:
        type: string
        label: 출처
        prompt: >-
          원본이 나온 플랫폼·사이트 이름. 로고·헤더·URL 로 판단한다(예 "네이버 스토어", "쿠팡", "알리익스프레스", "디바이스마트"). 견적서면 발행 회사명이 아니라 문서
          출처("이메일 첨부" 등)이며 모르면 null.
        example: 네이버 스토어

      source_url:
        type: url
        label: 원본 URL
        prompt: >-
          주소창이 보이거나 사용자가 URL 을 함께 준 경우만 그 URL. 없으면 null. 사이트 이름으로 URL 을 만들어 넣지 않는다.

      captured_at:
        type: date
        label: 캡처일
        prompt: >-
          원본을 캡처·수집한 날짜. 사용자가 말했으면 그 날짜, 화면에 시각 표시가 있으면 그것. 둘 다 없으면 null(오늘로 추정하지 않는다).

      vendor:
        type: string
        label: 판매처
        prompt: >-
          판매자·스토어·공급자명. 장바구니는 상품 묶음 헤더의 스토어명(예 "양말하우스"). 스토어가 둘 이상이면 여기는 null 로 두고 items[].vendor 에 각각 적는다.
          견적서면 공급자(발행처) 상호.
        example: 양말하우스

      buyer:
        type: string
        label: 수신
        prompt: >-
          견적을 받는 쪽(수신·귀하·구매자·발주처). 장바구니 화면 우상단의 로그인 계정 닉네임은 구매자가 아니므로 쓰지 않는다. 사용자가 "OO팀 견적" 처럼 말했으면 그것. 없으면
          null.

      ship_to:
        type: string
        label: 배송지
        prompt: >-
          배송지 표시를 지역 수준까지만(예 "예시배송지 (서울특별시 OO구)"). 상세 주소·수령인 이름·전화번호는 보여도 넣지 않는다. 없으면 null.
        example: 예시배송지 (서울특별시 OO구)

      currency:
        type: enum
        default: KRW
        values: [KRW, USD, JPY, CNY, EUR]
        label: 통화
        prompt: >-
          금액 표기 통화. 원·₩·"원화" 면 KRW(기본). $ 는 USD, ¥ 는 JPY(일본 사이트)·CNY(중국 사이트) 로 사이트에 맞춰 판단하고 애매하면 meta.note 에
          적는다.

      tax_included:
        type: bool
        default: true
        label: 부가세 포함
        prompt: >-
          장바구니·주문서는 소비자가(부가세 포함)이므로 true. 견적서에 공급가액/부가세 줄이 따로 있거나 "VAT 별도" 표기가 있으면 false 로 두고 summary.vat 를
          채운다.

      note:
        type: string
        label: 비고
        prompt: >-
          견적 전체에 걸친 특이사항만 한 줄씩 "· " 로 구분해 적는다. 예 "· 지금배달 탭 1건 미포함 · 쿠폰 미적용 기준 · 확인 필요: 3번 품목 수량". 광고·프로모션 문구는
          적지 않는다. 없으면 null.

  items:
    type: list
    required: true
    min: 1
    label: 품목
    prompt: |
      견적 대상 상품 한 줄 = 항목 하나. 상품 카드 하나에 옵션 행이 여럿이면(색상 2개, 사이즈 2개 등) 옵션 행마다 항목을 나눈다.
      선택 해제·품절·추천 상품은 넣지 않는다. 순서는 원본 표시 순서를 따른다.
    item:
      fields:

        name:
          type: string
          required: true
          label: 품명
          prompt: >-
            상품 제목 문자열만. 제목 앞뒤에 붙는 결제·배지 아이콘 텍스트("N pay", "NEW", "BEST", "무료배송", "오늘출발", 브랜드 마크)는 뺀다. 옵션·수량·가격은
            넣지 않는다. 원문 표기 그대로 두되 줄바꿈은 공백 하나로.
          example: 포켓몬 양말 캐릭터 아동양말 08번 크리스마스 양말선물 포켓몬스터 피카츄

        option:
          type: string
          label: 옵션/규격
          prompt: >-
            선택된 옵션 행의 텍스트 그대로(예 "포켓몬08번양말 / 혼합5종 4호"). 견적서면 규격·모델명·사양. 옵션이 없으면 null. "옵션 변경" 같은 버튼 글자는 아니다.
          example: 포켓몬08번양말 / 혼합5종 4호

        qty:
          type: int
          required: true
          default: 1
          label: 수량
          prompt: >-
            수량 입력칸(－ 1 ＋)의 숫자. 안 보이면 1. 단위가 "세트·박스" 면 그 단위 수를 쓰고 단위는 option 또는 note 에 적는다.

        unit_price:
          type: money
          required: true
          label: 단가
          prompt: >-
            실제 청구되는 단가. 옵션 행에 금액만 있으면 그 금액 ÷ 수량. 취소선이 그어진 정가나 "할인 전" 가격이 아니라 지금 적용된 가격. 견적서면 단가 열.
          example: 8800

        amount:
          type: money
          required: true
          label: 금액
          prompt: >-
            그 항목의 금액(단가×수량). 옵션 행 오른쪽 끝의 금액. 원본에 항목 금액이 없으면 단가×수량으로 채우고 note 에 "금액 계산값" 이라고 적는다.
          example: 8800

        vendor:
          type: string
          label: 판매처
          prompt: >-
            이 항목이 속한 스토어·판매자. 장바구니의 스토어가 하나뿐이면 null(meta.vendor 로 충분). 스토어가 둘 이상일 때만 각각 적는다.

        url:
          type: url
          label: 링크
          prompt: >-
            상품 상세 URL 이 텍스트로 보이거나 HTML 원본에 링크가 있을 때만. 캡처 이미지에서는 보통 null.

        note:
          type: string
          label: 비고
          prompt: >-
            구매 판단에 영향 있는 것만("품절 임박", "최소 주문 2개", "배송 3주", "금액 계산값", "확인 필요: 수량"). "선물가능상품"·"N pay"·"쿠폰받기"·"무료배송
            조건" 같은 배지·마케팅 문구는 넣지 않는다. 없으면 null.

  summary:
    type: object
    required: true
    label: 합계
    prompt: |
      원본의 합계 영역("주문 예상 금액", "결제 예정 금액", 견적서 하단 합계란)에서 뽑는다.
      캡처가 여러 장이면 각 캡처의 합계 영역 값을 더한다. 합계 영역이 아예 없으면 items 로 계산하고 meta.note 에 "· 합계 계산값" 을 적는다.
    fields:

      subtotal:
        type: money
        required: true
        label: 상품금액
        prompt: >-
          할인·배송비를 빼기 전 상품 금액 합("총 선택상품금액", "상품금액", 견적서의 "공급가액"). 품목 금액 합과 같아야 정상이며 다르면 원본을 다시 본다.
        example: 8800

      discount:
        type: money
        default: 0
        label: 할인
        prompt: >-
          모든 할인의 합을 양수로(즉시할인+쿠폰할인+포인트 사용 등). 화면에 할인 줄이 여러 개면 더한다. 없거나 전부 0원이면 0.
        example: 0

      discount_note:
        type: string
        label: 할인 내역
        prompt: >-
          할인 줄이 둘 이상이고 합이 0 보다 클 때만 "즉시할인 1,000 + 쿠폰할인 2,000" 형식으로. 한 줄뿐이거나 합이 0 이면 null.

      shipping:
        type: money
        default: 0
        label: 배송비
        prompt: >-
          총 배송비("총 배송비", "배송비", "운송비"). 무료면 0. 스토어별 배송비가 여럿이면 합계 영역의 총 배송비를 쓴다.
        example: 2500

      vat:
        type: money
        label: 부가세
        prompt: >-
          견적서에 부가세(VAT) 줄이 따로 있을 때만 그 금액(meta.tax_included=false 와 짝). 장바구니·주문서면 null.

      total:
        type: money
        required: true
        label: 합계
        prompt: >-
          최종 결제·청구 금액("총 주문 예상 금액", "결제 예정 금액", "합계", "Total"). 상품금액 − 할인 + 배송비 (+ 부가세) 와 같아야 정상이며 다르면 원본을 다시
          본다.
        example: 11300

# ---------------------------------------------------------------------
# 정합성 검사 — validate/render 가 실행. level: error(중단) | warn(경고만)
#   scope item  : items[] 각 항목의 키를 그대로 이름으로 쓴다
#   scope quote : meta · items · summary 를 쓴다. nz(x)=null 이면 0
# ---------------------------------------------------------------------
checks:
  - id: item_amount
    scope: item
    rule: "amount == qty * unit_price"
    level: warn
    message: "품목 금액 ≠ 수량 × 단가"
  - id: subtotal_equals_items
    scope: quote
    rule: "summary.subtotal == sum(nz(i.amount) for i in items)"
    level: warn
    message: "상품금액 ≠ 품목 금액 합"
  - id: total_formula
    scope: quote
    rule: "summary.total == summary.subtotal - nz(summary.discount) + nz(summary.shipping) + nz(summary.vat)"
    level: warn
    message: "합계 ≠ 상품금액 − 할인 + 배송비 (+ 부가세)"
  - id: vat_needs_flag
    scope: quote
    rule: "summary.vat is None or meta.tax_included is False"
    level: warn
    message: "부가세가 있으면 meta.tax_included 는 false 여야 한다"

# ---------------------------------------------------------------------
# 렌더 규칙 — 표에 실을 키와 순서. null 뿐인 행·열은 자동 생략
# ---------------------------------------------------------------------
render:
  header_keys: [quote_no, quote_date, valid_until, vendor, buyer, ship_to]
  item_columns: [name, option, qty, unit_price, amount, vendor, note]
  summary_rows: [subtotal, discount, shipping, vat, total]
  money_format: {KRW: "{n}원", USD: "${n}", JPY: "¥{n}", CNY: "CN¥{n}", EUR: "€{n}"}
  footer: "출처: {source_platform} {source_type} · 캡처 {captured_at}"
