<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Prefill과 Decode</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* layout: 발표 화면용 한 장. 얇은 제목 줄 아래에 그림이 화면에 맞춰 들어가고, 아래 줄에서 재생을 고르고 한 단계씩 넘긴다.
   그림은 왼쪽 입력(토큰 · 임베딩) → 가운데 같은 모델 경로(Transformer 레이어) → 오른쪽 KV cache, 아래에 생성된 토큰 줄과 핵심 정리 표 */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#1A2130; --ink-2:#465166; --ink-3:#77818F;
  --line:#D5DAE3; --line-strong:#5A6578;
  --pre:#2D58B5; --pre-bg:#E2EAFA;     /* Prefill · 입력 토큰 */
  --dec:#C2386A; --dec-bg:#FBE1EA;     /* Decode · 생성 토큰 */
  --key:#6A4DBF; --key-bg:#ECE6FA;     /* Key */
  --val:#2B774A; --val-bg:#DFF0E4;     /* Value */
  --mem:#4B586C; --mem-bg:#E8ECF2;     /* 모델 · 메모리 (중립) */
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono","D2Coding",Consolas,"Malgun Gothic",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141A; --surface:#1A1F28; --ink:#E6E9EF; --ink-2:#B4BBC9; --ink-3:#8791A1;
    --line:#303746; --line-strong:#8D97A9;
    --pre:#8DAEF4; --pre-bg:#1B2946;
    --dec:#F08BB0; --dec-bg:#3B1826;
    --key:#B6A4F2; --key-bg:#241B3E;
    --val:#7AC998; --val-bg:#15301F;
    --mem:#A7B2C4; --mem-bg:#222935;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#1A1F28; --ink:#E6E9EF; --ink-2:#B4BBC9; --ink-3:#8791A1;
  --line:#303746; --line-strong:#8D97A9;
  --pre:#8DAEF4; --pre-bg:#1B2946;
  --dec:#F08BB0; --dec-bg:#3B1826;
  --key:#B6A4F2; --key-bg:#241B3E;
  --val:#7AC998; --val-bg:#15301F;
  --mem:#A7B2C4; --mem-bg:#222935;
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;display:flex;flex-direction:column}

.bar{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 18px;padding-inline:clamp(16px,2.4vw,36px);padding-block:14px 10px}
.bar h1{font-size:clamp(17px,1.5vw,22px);line-height:1.3;font-weight:700;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-3);margin:0}
.tools{margin-left:auto;align-self:center;display:flex;gap:8px}
.btn{font:500 13px var(--sans);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--line-strong);color:var(--ink)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--pre);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
/* 재생 고르기: 고른 것만 채워진다. Prefill 파랑 · Decode 분홍 · 전체 · 대화 */
.btn.go{font-weight:600;color:var(--pre);border-color:var(--pre)}
.btn.go:hover{color:var(--pre);border-color:var(--pre);background:var(--pre-bg)}
.btn.go[aria-pressed="true"]{color:var(--surface);background:var(--pre)}
.btn.go.dec{color:var(--dec);border-color:var(--dec)}
.btn.go.dec:hover{color:var(--dec);border-color:var(--dec);background:var(--dec-bg)}
.btn.go.dec[aria-pressed="true"]{color:var(--surface);background:var(--dec)}
.btn.go.mem{color:var(--ink);border-color:var(--line-strong)}
.btn.go.mem:hover{color:var(--ink);border-color:var(--ink);background:var(--mem-bg)}
.btn.go.mem[aria-pressed="true"]{color:var(--surface);background:var(--ink)}
.btn.go.key{color:var(--key);border-color:var(--key)}
.btn.go.key:hover{color:var(--key);border-color:var(--key);background:var(--key-bg)}
.btn.go.key[aria-pressed="true"]{color:var(--surface);background:var(--key)}

.stage{flex:1;min-height:0;padding-inline:clamp(16px,2.4vw,36px);padding-block:0 clamp(12px,2vh,24px)}
.fig{height:100%;margin:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.scroll{flex:1;min-height:400px;position:relative}
.dg{position:absolute;left:16px;top:16px;width:calc(100% - 32px);height:calc(100% - 32px)}

/* 아래 줄: 재생 고르기 · 단계 표 / 설명 · 넘김 */
.cap{border-top:1px solid var(--line);padding:10px 20px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.modes{grid-column:1;display:flex;flex-wrap:wrap;gap:8px}
.steps{grid-column:2/4;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0;padding:0;list-style:none}
.chip{font:500 12.5px var(--sans);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 11px;cursor:pointer}
.chip:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.pre{color:var(--pre)}
.chip.dec{color:var(--dec)}
.chip.done{border-color:var(--line-strong)}
.chip[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.pre[aria-current="step"]{background:var(--pre);border-color:var(--pre)}
.chip.dec[aria-current="step"]{background:var(--dec);border-color:var(--dec)}
#cap{grid-column:1/3;margin:0;min-height:3.2em;max-width:112ch;color:var(--ink-2);font-size:14px}
#cap strong{color:var(--ink)}
.ctl{grid-column:3;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
code{font-family:var(--mono);font-size:.9em;background:var(--mem-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
kbd{font:600 11px var(--mono);color:var(--ink-2);background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
/* 좁거나 낮은 화면: 화면 맞춤 대신 그림을 읽을 수 있는 크기로 두고 그림 안에서 가로 스크롤 */
@media (max-width:960px),(max-height:540px){
  html,body{height:auto}
  .stage{flex:none}
  .fig{height:auto}
  .scroll{flex:none;min-height:0;overflow-x:auto;padding:16px}
  .dg{position:static;display:block;width:1280px;height:auto}
  .cap{grid-template-columns:minmax(0,1fr)}
  .modes,.steps,#cap,.ctl{grid-column:1}
  .ctl{justify-content:flex-start}
}
/* diagram */
.dg text{font-family:var(--sans);font-size:12.5px;fill:var(--ink)}
.dg .t{font-size:14px;font-weight:600}
.dg .h2{font-size:17px;font-weight:700}
.dg .s{font-size:12px;fill:var(--ink-2)}
.dg .x{font-size:11px;fill:var(--ink-2)}
.dg .lb{font-size:10.5px;fill:var(--ink-3)}
.dg .m{font-family:var(--mono);font-size:11px;fill:var(--ink-2)}
.dg .mb{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--ink)}
.dg .num{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.dg .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.dg .c{text-anchor:middle}
.dg .e{text-anchor:end}
.dg .b6{font-weight:600}
.dg .ink{fill:var(--ink)}
.dg .w{fill:var(--surface)}
.dg .k-pre{fill:var(--pre)}
.dg .k-dec{fill:var(--dec)}
.dg .k-key{fill:var(--key)}
.dg .k-val{fill:var(--val)}
.dg .k-mem{fill:var(--mem)}
/* 구역 */
.dg .g-in{fill:var(--pre-bg);fill-opacity:.45;stroke:var(--pre);stroke-width:1.25;stroke-dasharray:6 5}
.dg .g-model{fill:var(--mem-bg);stroke:var(--mem);stroke-width:1.5}
.dg .g-cache{fill:var(--surface);stroke:var(--mem);stroke-width:1.5}
.dg .g-out{fill:var(--dec-bg);fill-opacity:.45;stroke:var(--dec);stroke-width:1.25;stroke-dasharray:6 5}
.dg .bub{fill:var(--surface);stroke:var(--pre);stroke-width:1.5}
.dg .pill{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.25}
.dg .tokb{fill:var(--pre-bg);stroke:var(--pre);stroke-width:1.25}
.dg .tokb.dec{fill:var(--dec-bg);stroke:var(--dec)}
.dg .tokb.dash{fill:var(--surface);stroke:var(--line-strong);stroke-dasharray:4 3}
.dg .tokdone{fill:var(--dec);stroke:var(--dec);stroke-width:1.25}      /* 이미 나온 토큰: 채운 상자 */
.dg .cur-in{fill:none;stroke:var(--dec);stroke-width:2.5}              /* 지금 Decode 에 들어가는 토큰: 고리 */
.dg .emb{fill:var(--pre)}
.dg .emb.d{fill:var(--dec)}
.dg .layer{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.dg .sub{fill:var(--bg);stroke:var(--line);stroke-width:1}
.dg .sub.attn{fill:var(--key-bg);stroke:var(--key)}
.dg .head{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.dg .node{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.dg .kbar{fill:var(--key-bg);stroke:var(--key);stroke-width:1}
.dg .vbar{fill:var(--val-bg);stroke:var(--val);stroke-width:1}
.dg .kbar.dash,.dg .vbar.dash{fill:var(--surface);stroke-dasharray:4 3}
.dg .stripe{fill:none;stroke-width:1.5;opacity:.7}   /* 막대 안 줄무늬 = 벡터 값 표시 */
.dg .stripe.k{stroke:var(--key)}
.dg .stripe.val{stroke:var(--val)}   /* 'v' 라고 쓰면 .v{display:none} 에 걸려 사라진다 */
.dg .pb{fill:var(--pre)}
.dg .pb.d{fill:var(--dec)}
.dg .pb.lo{fill:var(--line)}
.dg .ln{fill:none;stroke:var(--line-strong);stroke-width:1.5}
.dg .ln.pre{stroke:var(--pre);stroke-width:2}
.dg .ln.dec{stroke:var(--dec);stroke-width:2}
.dg .ln.key{stroke:var(--key);stroke-width:2}
.dg .ln.thin{stroke:var(--line);stroke-width:1}
.dg .dash{stroke-dasharray:5 4}
.dg .mk-ink{fill:var(--line-strong)}
.dg .mk-pre{fill:var(--pre)}
.dg .mk-dec{fill:var(--dec)}
.dg .mk-key{fill:var(--key)}
.dg .badge{fill:var(--ink)}
.dg .bn{font-size:12px;font-weight:700;fill:var(--surface);text-anchor:middle}
.dg .hl{fill:var(--key);fill-opacity:.13;stroke:var(--key);stroke-width:1.25;stroke-dasharray:5 3}
.dg .glow{fill:var(--pre);fill-opacity:.12;stroke:var(--pre);stroke-width:3;opacity:0}
.dg .glow.d{fill:var(--dec);stroke:var(--dec)}
.dg .seg{stroke:var(--surface);stroke-width:1.5}
.dg .seg.pre{fill:var(--pre)}
.dg .seg.dec{fill:var(--dec)}
.dg .card{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.dg .card.pre{stroke:var(--pre)}
.dg .card.dec{stroke:var(--dec)}
.dg .tag{font-size:10.5px;font-weight:700;fill:var(--surface);text-anchor:middle}
.dg .tagb{fill:var(--pre)}
.dg .tagb.dec{fill:var(--dec)}
.dg .tagb.mem{fill:var(--mem)}
.dg .rule{stroke:var(--line);stroke-width:1}
.dg .colh{fill:var(--pre-bg);stroke:var(--pre);stroke-width:1}
.dg .colh.dec{fill:var(--dec-bg);stroke:var(--dec)}
.dg .colhl{fill:var(--pre);fill-opacity:.1;stroke:var(--pre);stroke-width:1.5;opacity:0;transition:opacity .3s}
.dg .colhl.dec{fill:var(--dec);stroke:var(--dec)}
.dg[data-ph="pre"] .colhl.pre,.dg[data-ph="dec"] .colhl.dec{opacity:1}
/* 모드 알약: 지금 단계가 Prefill 인지 Decode 인지 */
.dg .ph{display:none}
.dg[data-ph="rest"] .ph-rest,.dg[data-ph="pre"] .ph-pre,.dg[data-ph="dec"] .ph-dec,.dg[data-ph="none"] .ph-rest{display:inline}
/* 재생마다 갈아 끼우는 묶음: v-main = 재생 전 · Prefill · Decode · 전체, v-conv = 대화 재생 */
.dg .v{display:none}
.dg[data-mode="rest"] .v-main,.dg[data-mode="pre"] .v-main,.dg[data-mode="dec"] .v-main,.dg[data-mode="all"] .v-main,.dg[data-mode="conv"] .v-conv{display:inline}
/* 재생 상태. 스크립트가 [data-s] 요소마다 rest(재생 전) · next(아직) · now(지금 단계) · past(지난 단계) · off(이 재생에 없음)를 붙인다.
   .rev = 재생 전에도 보이는 내용. 재생 중에는 제 단계에서 나타난다.
   .fx  = 재생 중에만 보이는 표시. 제 단계에서 나타나 끝까지 남는다. 지나가는 표시(.glow · .flow · .tok)는 .fx 묶음 안에 둔다.
   '동작 줄이기' 설정으로 재생을 끄지 않는다. 원격 데스크톱 세션은 그 설정이 기본으로 켜져 있어서, 끄는 규칙을 두면 통째로 움직이지 않는다.
   재생은 모두 눌러서 시작한다 */
.dg .fx{opacity:0;visibility:hidden}
.dg .fx.now,.dg .fx.past{opacity:1;visibility:visible}
.dg .rev.next,.dg .rev.off{opacity:0;visibility:hidden}
.dg .zone{transition:opacity .35s ease}
.dg.playing .zone.dim{opacity:.42}
.dg .flow{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:.3 1;stroke-dashoffset:.3;opacity:0}
.dg .tok{opacity:0}
.dg .s-pre{stroke:var(--pre)}
.dg .s-dec{stroke:var(--dec)}
.dg .s-key{stroke:var(--key)}
.dg .s-val{stroke:var(--val)}
.dg .tk-pre{fill:var(--pre)}
.dg .tk-dec{fill:var(--dec)}
.dg .tkt{font-size:11px;font-weight:600;fill:var(--surface);text-anchor:middle}
.dg .now.a-in,.dg .now .a-in{animation:k-in .4s ease-out var(--d,0s) backwards}
.dg .now.a-up,.dg .now .a-up{animation:k-up .5s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
.dg .now.a-pop,.dg .now .a-pop{animation:k-pop .45s cubic-bezier(.3,1.4,.5,1) var(--d,0s) backwards;transform-box:fill-box;transform-origin:center}
.dg .now.a-wipe,.dg .now .a-wipe{animation:k-wipe .6s ease-out var(--d,0s) backwards}
.dg .now .a-glow{animation:k-glow 1.1s ease-in-out var(--d,0s) both}
.dg .now .a-flow{animation:k-flow var(--t,1s) cubic-bezier(.4,0,.6,1) var(--d,0s) both}
.dg .now .a-move{animation:k-move var(--t,1s) cubic-bezier(.45,0,.55,1) var(--d,0s) both}
.dg .now .a-stay{animation:k-stay var(--t,1s) cubic-bezier(.45,0,.55,1) var(--d,0s) both}
.dg .now .a-out{animation:k-out .4s ease-out var(--d,0s) forwards}   /* 제 때에 사라진다 (고리가 다음 토큰으로 옮겨 갈 때) */
@keyframes k-in{from{opacity:0}}
@keyframes k-up{from{opacity:0;transform:translateY(8px)}}
@keyframes k-pop{from{opacity:0;transform:scale(.85)}}
@keyframes k-wipe{0%{opacity:0;clip-path:inset(-4px 100% -4px -4px)}5%{opacity:1}100%{opacity:1;clip-path:inset(-4px -4px -4px -4px)}}
@keyframes k-glow{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes k-flow{0%{opacity:0;stroke-dashoffset:.3}10%{opacity:1}90%{opacity:1}100%{opacity:0;stroke-dashoffset:-1}}
@keyframes k-move{0%{opacity:0;transform:translate(var(--x0),var(--y0))}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translate(var(--x1),var(--y1))}}
@keyframes k-out{to{opacity:0}}
@keyframes k-stay{0%{opacity:0;transform:translate(var(--x0),var(--y0))}10%{opacity:1}100%{opacity:1;transform:translate(var(--x1),var(--y1))}}
.dg .now .a-stay{opacity:1}
</style>
</head>
<body>
<header class="bar">
  <h1>LLM 추론 · Prefill과 Decode</h1>
  <p class="eyebrow">입력 임베딩 · 같은 Transformer 경로 · KV cache</p>
  <div class="tools">
    <button class="btn" id="fs" type="button">전체 화면</button>
  </div>
</header>

<main class="stage">
  <figure class="fig">
    <div class="scroll">
      <svg id="dg" class="dg" data-mode="rest" data-ph="rest" viewBox="0 0 1600 880" role="img" aria-label="사용자 입력이 토큰으로 나뉘고 임베딩 벡터가 되어 Transformer 레이어를 지나며, 레이어마다 계산한 K(찾기용 꼬리표), V(꺼내 쓸 내용)가 KV cache에 저장된다. Prefill은 입력 토큰 전체를 한 번에 병렬로 처리해 KV를 만들고 첫 토큰을 내며, Decode는 마지막 토큰 1개만 넣고 저장된 K, V를 재사용해 다음 토큰을 하나씩 만든다. 둘은 같은 레이어를 지나는 두 가지 추론 모드다. 대화 재생은 턴마다 KV cache가 쌓이는 모습을 보여 준다.">
        <defs>
          <marker id="m-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-ink" d="M0 0L10 5L0 10z"/></marker>
          <marker id="m-pre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-pre" d="M0 0L10 5L0 10z"/></marker>
          <marker id="m-dec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-dec" d="M0 0L10 5L0 10z"/></marker>
          <marker id="m-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-key" d="M0 0L10 5L0 10z"/></marker>
        </defs>

        <!-- ===== 왼쪽: 입력 (토큰화 · 임베딩). 재생 전에도 보이고, Prefill 재생에서는 제 단계에서 나타난다. Decode 재생에서는 시작 단계부터 있다 ===== -->
        <g class="zone" data-z="p1 p2 p3 p4 d0 c0 c1 c2 c3 c4 c5">
          <text class="h2" x="40" y="48">입력</text>
          <text class="s" x="92" y="48">토큰화 → 임베딩</text>
          <g class="rev a-up" data-s="p1" data-s-dec="d0" data-keep="conv">
            <rect class="bub" x="40" y="66" width="380" height="54" rx="10"/>
            <text class="lb" x="58" y="86">사용자 입력</text>
            <text x="58" y="110" style="font-size:16px;font-weight:700">LLM이 뭐야?</text>
          </g>
          <g class="rev a-up" data-s="p2" data-s-dec="d0" data-keep="conv">
            <path class="ln" d="M230 120V142" marker-end="url(#m-ink)"/>
            <rect class="pill" x="110" y="148" width="240" height="30" rx="15"/>
            <text class="x c" x="230" y="168">토크나이저 · 글을 토큰으로 나눈다</text>
            <path class="ln" d="M230 178V200" marker-end="url(#m-ink)"/>

     conv  대화가 이어지면     = 사전 컨텍스트 → 질문 1 → 답변 1 → 질문 2 → 답변 2 → 이후
     ▶ 버튼은 자동으로 넘기고, 이전 · 다음 · 단계 표를 누르면 그 단계에서 멈춘다.
     [data-s] 요소마다 rest · next · now · past · off 를 붙인다. data-s-<재생> · data-until-<재생> 으로 재생마다 단계를 달리 줄 수 있고,
     data-m 은 이 요소가 있는 재생 목록, data-keep 은 재생 내내 그대로 보이는(past) 재생 목록이다.
     키: 1~4 = 재생 고르기, ← → = 한 단계, Space = 자동 · 멈춤, R = 처음부터, Esc = 전체 보기 */
  var svg=document.getElementById('dg');
  var MODES=['pre','dec','all','conv'];
  var SEQ={
    pre:['p1','p2','p3','p4','p5','p6'],
    dec:['d0','d1','d2','d3','d4','d5','d6','d7'],
    all:['p1','p2','p3','p4','p5','p6','d1','d2','d3','d4','d5','d6','d7'],
    conv:['c0','c1','c2','c3','c4','c5']
  };
  /* 단계가 Prefill 인지 Decode 인지. 모드 알약과 정리 표의 열 색이 따라간다 */
  var PH={c0:'pre',c1:'pre',c2:'dec',c3:'pre',c4:'dec',c5:'none',d0:'pre'};
  function phOf(id){return PH[id]||(id.charAt(0)==='p'?'pre':'dec');}
  var DUR={p1:2800,p2:3200,p3:3400,p4:3400,p5:4600,p6:3400,d0:3000,d1:3400,d2:4000,d3:3000,d4:3000,d5:5200,d6:5200,d7:5600,c0:3400,c1:3200,c2:3400,c3:3200,c4:3400,c5:5000};
  var LABEL={p1:'① 입력',p2:'② 토큰화',p3:'③ 임베딩',p4:'④ 병렬 입력',p5:'⑤ 레이어 · KV 저장',p6:'⑥ 첫 토큰',
    d0:'시작',d1:'토큰 1개',d2:'K, V 재사용',d3:'KV 추가',d4:'다음 토큰',d5:'반복 2',d6:'반복 3',d7:'끝까지',
    c0:'0 사전 컨텍스트',c1:'1 질문',c2:'2 답변',c3:'3 질문',c4:'4 답변',c5:'이후'};
  var CAP={
    rest:'<strong>전체 그림.</strong> 입력 글은 토큰으로 나뉘고 임베딩 벡터가 되어 Transformer 레이어를 지난다. 레이어마다 계산한 K(찾기용 꼬리표)와 V(꺼내 쓸 내용)는 오른쪽 KV cache에 저장된다. <strong>Prefill</strong>은 입력 토큰 전체를 한 번에 병렬로 처리해 KV를 만들고 첫 토큰을 낸다. <strong>Decode</strong>는 마지막 토큰 1개만 넣고 저장된 K, V를 재사용해 다음 토큰을 하나씩 만든다. 둘은 다른 구역이 아니라 같은 레이어를 지나는 두 가지 추론 모드다. 출력 줄에서 채운 상자는 이미 나온 토큰, 고리는 지금 Decode에 들어가는 마지막 토큰이다. 숫자는 설명용 예시다.',
    p1:'<strong>① 입력.</strong> 사용자가 ‘LLM이 뭐야?’를 보낸다. 모델에 들어가기 전에 글은 숫자로 바뀌어야 한다.',
    p2:'<strong>② 토큰화.</strong> 토크나이저가 글을 토큰 5개로 나눈다. 토큰은 단어보다 작을 수도, 클 수도 있다. 이 다섯이 Prefill에서 한 번에 처리된다.',
    p3:'<strong>③ 임베딩.</strong> 임베딩 레이어가 토큰마다 숫자 벡터로 바꾼다. 그림은 8칸이지만 실제로는 수천 칸이다. 이 벡터들이 모델의 입력이다.',
    p4:'<strong>④ Prefill · 한 번에 넣는다.</strong> 임베딩 5개가 한꺼번에 같은 입력 자리로 들어간다. 하나씩이 아니라 병렬이라서 입력이 길어도 빠르다.',
    p5:'<strong>⑤ 레이어 통과 · KV 저장.</strong> 레이어마다 Self-Attention이 토큰마다 Q, K, V를 계산한다. K는 나중에 찾을 때 맞춰 볼 꼬리표, V는 그때 꺼내 쓸 내용이다. 둘을 KV cache에 저장한다. 레이어 N개 × 토큰 5개 × (K, V)가 한 번에 쌓인다. 이 과정이 Prefill이다.',
    p6:{_:'<strong>⑥ 첫 토큰.</strong> 출력 레이어가 다음 토큰 확률을 내고 가장 높은 ‘네’를 고른다. Prefill 끝. 이제부터 Decode가 이어받는다.',
        all:'<strong>⑥ 첫 토큰.</strong> 출력 레이어가 다음 토큰 확률을 내고 가장 높은 ‘네’를 고른다. Prefill 끝. 다음 단계부터 Decode가 같은 레이어로 이어받는다.'},
    d0:'<strong>시작 · Prefill이 끝난 상태.</strong> KV cache에 입력 토큰 5개의 K, V가 있고 첫 토큰 ‘네’가 나와 있다. Decode는 여기서 이어받는다.',
    d1:'<strong>Decode ① 토큰 1개만 넣는다.</strong> 방금 생성한 ‘네’ 하나만 같은 입력 자리로 들어간다(출력 줄의 고리). 앞의 다섯은 다시 넣지 않는다. K, V가 이미 cache에 있기 때문이다.',
    d2:'<strong>Decode ② 저장된 K, V 재사용.</strong> ‘네’가 같은 레이어를 지난다. Self-Attention은 ‘네’의 Q(지금 찾는 것)를 cache에 있는 K(꼬리표) 5개와 맞춰 점수를 내고, 점수만큼 V(내용) 5개를 섞는다. 앞 토큰의 K, V를 다시 계산하지 않는다.',
    d3:'<strong>Decode ③ KV 추가.</strong> ‘네’의 K, V를 cache 끝에 붙인다. 이제 6개. 다음 토큰은 이 여섯을 본다.',
    d4:'<strong>Decode ④ 다음 토큰.</strong> 출력 레이어가 ‘,’를 고른다. 생성된 토큰은 출력 줄에 붙고, 곧 다음 입력이 된다. 고리가 ‘,’로 옮겨 가고 ‘네’는 이미 나온 토큰(채운 상자)이 된다.',
    d5:'<strong>반복 2.</strong> ‘,’가 들어가 K 6개와 대조하고, 자기 K, V를 붙이고(7개), ‘LLM’을 낸다. 한 바퀴에 토큰 1개. 이것이 순차 생성이다. 들어가는 토큰은 늘 마지막 1개(고리)뿐이고, 앞 토큰은 채운 상자로 남는다.',
    d6:'<strong>반복 3.</strong> ‘LLM’이 들어가 7개와 대조하고 8개로 늘리고 ‘은’을 낸다. 바퀴마다 cache가 1개씩 커진다.',
    d7:'<strong>끝 토큰까지.</strong> 같은 바퀴가 ‘대규모’, ‘언어’, ‘모델’ … 로 이어지고, 끝 토큰(&lt;end&gt;)이 나오면 멈춘다. 답변이 1,500 tokens면 1,500바퀴다. Decode가 느린 이유다.',
    c0:'<strong>0 · 사전 컨텍스트.</strong> 시스템 프롬프트, 도구 스키마, 프로젝트 메모리, 이전 대화가 질문보다 먼저 Prefill 된다. 8,000 tokens가 질문 전에 cache에 쌓인다.',
    c1:'<strong>1 · 사용자 질문 (Turn 1).</strong> ‘LLM이 뭐야?’ 500 tokens가 Prefill 된다. 앞의 8,000은 다시 계산하지 않는다. 누적 8,500.',
    c2:'<strong>2 · 어시스턴트 답변 (Turn 1).</strong> Decode로 1,500 tokens를 한 개씩 만든다. 생성된 토큰의 K, V도 cache에 붙는다. 누적 10,000.',
    c3:'<strong>3 · 사용자 질문 (Turn 2).</strong> ‘코드 예시도 알려줘’에 붙여 넣은 자료까지 3,000 tokens가 Prefill 된다. 누적 13,000.',
    c4:'<strong>4 · 어시스턴트 답변 (Turn 2).</strong> Decode로 2,500 tokens. 누적 15,500. 바퀴마다 cache 전체(1만 개 이상)의 K와 대조한다.',
    c5:'<strong>이후에도 계속.</strong> 대화가 길어질수록 KV cache가 커지고, 바퀴마다 보는 K도 늘어 느려지고 비싸진다. KV는 GPU 메모리에 있다. 서비스는 같은 앞부분(시스템 프롬프트 등)을 Prompt Cache로 재사용하고, 세션 저장은 대화 기록을 남겼다가 다시 열 때 Prefill로 KV를 다시 만든다.'
  };
  var els=[].slice.call(svg.querySelectorAll('[data-s]'));
  var zones=[].slice.call(svg.querySelectorAll('.zone'));
  var stepsEl=document.getElementById('steps'),capEl=document.getElementById('cap');
  var goB={};MODES.forEach(function(m){goB[m]=document.getElementById('go-'+m);});
  var prevB=document.getElementById('prev'),nextB=document.getElementById('next'),autoB=document.getElementById('auto'),endB=document.getElementById('end');
  var STATES=['rest','next','now','past','off'];
  var mode='pre',i=-1,auto=false,timer=null;

  function buildSteps(){
    var h='';
    SEQ[mode].forEach(function(id,k){
      var l=LABEL[id],ph=phOf(id);
      h+='<li><button type="button" class="chip'+(ph==='pre'?' pre':(ph==='dec'?' dec':''))+'" data-i="'+k+'">'+(typeof l==='string'?l:(l[mode]||l._))+'</button></li>';
    });
    stepsEl.innerHTML=h;
  }
  function has(list,m){return !!list&&(' '+list+' ').indexOf(' '+m+' ')>=0;}
  function attr(el,name){return el.getAttribute(name+'-'+mode)||el.getAttribute(name);}
  function stateOf(el,seq){
    if(i<0)return 'rest';
    if(has(el.getAttribute('data-keep'),mode))return 'past';
    var m=el.getAttribute('data-m');
    if(m&&!has(m,mode))return 'off';
    var j=seq.indexOf(attr(el,'data-s'));
    if(j<0)return 'off';
    if(j===i)return 'now';
    if(j>i)return 'next';
    var u=attr(el,'data-until');
    if(u){var k=seq.indexOf(u);if(k>=0&&i>=k)return 'off';}
    return 'past';
  }
  /* replay 를 주면 지금 단계의 표시를 처음부터 다시 움직인다 */
  function render(replay){
    var seq=SEQ[mode],playing=i>=0,cur=playing?seq[i]:null,todo=[];
    svg.classList.toggle('playing',playing);
    svg.setAttribute('data-mode',playing?mode:'rest');
    svg.setAttribute('data-ph',playing?phOf(cur):'rest');
    els.forEach(function(el){
      var c=stateOf(el,seq);
      if(el._c===c&&!(replay&&c==='now'))return;
      STATES.forEach(function(s){el.classList.remove(s);});
      el._c=c;
      todo.push(el);
    });
    void svg.getBoundingClientRect();
    todo.forEach(function(el){el.classList.add(el._c);});
    zones.forEach(function(z){
      z.classList.toggle('dim',playing&&!has(z.getAttribute('data-z'),cur));
    });
    [].forEach.call(stepsEl.querySelectorAll('.chip'),function(b){
      var k=+b.getAttribute('data-i');
      if(k===i)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');
      b.classList.toggle('done',playing&&k<i);
    });
    var cap=playing?CAP[cur]:CAP.rest;
    capEl.innerHTML=typeof cap==='string'?cap:(cap[mode]||cap._);
    var last=playing&&i>=seq.length-1;
    prevB.disabled=i<=0;
    nextB.disabled=last;
    endB.disabled=!playing;
    autoB.textContent=auto?'일시 정지':(last?'다시 재생':'자동 재생');
    MODES.forEach(function(m){goB[m].setAttribute('aria-pressed',playing&&mode===m?'true':'false');});
  }
  function schedule(){
    clearTimeout(timer);
    if(!auto||i<0)return;
    var seq=SEQ[mode];
    timer=setTimeout(function(){
      if(i<seq.length-1){i++;render(true);schedule();}
      else{auto=false;render(false);}
    },DUR[seq[i]]);
  }
  function start(m,paused){mode=m;i=0;auto=!paused;buildSteps();render(true);schedule();}
  function jump(k){i=k;auto=false;render(true);schedule();}
  function next(){
    if(i<0){start(mode,true);return;}
    if(i<SEQ[mode].length-1)jump(i+1);
  }
  function prev(){if(i>0)jump(i-1);}
  function toggleAuto(){
    if(i<0||(!auto&&i>=SEQ[mode].length-1)){start(mode);return;}
    auto=!auto;render(false);schedule();
  }
  function end(){i=-1;auto=false;render(false);schedule();}

  MODES.forEach(function(m){goB[m].addEventListener('click',function(){start(m);});});
  prevB.addEventListener('click',prev);
  nextB.addEventListener('click',next);
  autoB.addEventListener('click',toggleAuto);
  endB.addEventListener('click',end);
  stepsEl.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('.chip'):null;
    if(b)jump(+b.getAttribute('data-i'));
  });
  document.addEventListener('keydown',function(e){
    if(e.altKey||e.ctrlKey||e.metaKey)return;
    var k=e.key,onBtn=e.target&&e.target.tagName==='BUTTON';
    if(k>='1'&&k<='4')start(MODES[+k-1]);
    else if(k==='ArrowRight'||k==='PageDown'){next();e.preventDefault();}
    else if(k==='ArrowLeft'||k==='PageUp'){prev();e.preventDefault();}
    else if(k===' '&&!onBtn){toggleAuto();e.preventDefault();}
    else if(k==='r'||k==='R'||k==='ㄱ'){if(i>=0)start(mode);}
    else if(k==='Escape'){if(i>=0){end();e.preventDefault();}}
  });

  buildSteps();
  render(false);   /* 열자마자 재생하지 않는다. 눌러야 시작한다 */

  var fs=document.getElementById('fs'),root=document.documentElement;
  if(!document.fullscreenEnabled||!root.requestFullscreen){fs.hidden=true;return;}
  fs.addEventListener('click',function(){
    if(document.fullscreenElement){document.exitFullscreen();return;}
    root.requestFullscreen().catch(function(){fs.hidden=true;});
  });
  document.addEventListener('fullscreenchange',function(){
    fs.textContent=document.fullscreenElement?'전체 화면 끝내기':'전체 화면';
  });
})();
</script>
