<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light;box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>구매 품의 흐름도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* layout: 발표 화면용 한 장. 얇은 제목 줄 아래에 흐름도가 화면에 맞춰 들어가고, 캡션 한 줄이 붙는다 */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --ink:#1A2130; --ink-2:#465166; --ink-3:#77818F;
  --line:#D5DAE3; --line-strong:#5A6578;
  --infer:#2D58B5; --infer-bg:#E2EAFA;
  --skill:#946511; --skill-bg:#FAEFD3;
  --run:#2B774A; --run-bg:#DFF0E4;
  --ref:#6747AD; --ref-bg:#EDE7F9;
  --review:#BC364C; --review-bg:#FBE2E5;
  --file:#4B586C; --file-bg:#E8ECF2;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono","D2Coding",Consolas,"Malgun Gothic",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141A; --surface:#1A1F28; --ink:#E6E9EF; --ink-2:#B4BBC9; --ink-3:#8791A1;
    --line:#303746; --line-strong:#8D97A9;
    --infer:#8DAEF4; --infer-bg:#1B2946;
    --skill:#E0B45A; --skill-bg:#30270F;
    --run:#7AC998; --run-bg:#15301F;
    --ref:#B59AEE; --ref-bg:#281F43;
    --review:#EE8799; --review-bg:#3B1921;
    --file:#A7B2C4; --file-bg:#222935;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#1A1F28; --ink:#E6E9EF; --ink-2:#B4BBC9; --ink-3:#8791A1;
  --line:#303746; --line-strong:#8D97A9;
  --infer:#8DAEF4; --infer-bg:#1B2946;
  --skill:#E0B45A; --skill-bg:#30270F;
  --run:#7AC998; --run-bg:#15301F;
  --ref:#B59AEE; --ref-bg:#281F43;
  --review:#EE8799; --review-bg:#3B1921;
  --file:#A7B2C4; --file-bg:#222935;
  color-scheme:dark;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;display:flex;flex-direction:column}

.bar{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 18px;padding-inline:clamp(16px,2.4vw,36px);padding-block:14px 10px}
.bar h1{font-size:clamp(17px,1.5vw,22px);line-height:1.3;font-weight:700;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-3);margin:0}
.tools{margin-left:auto;align-self:center;display:flex;align-items:center;gap:10px}
.pager{display:flex;align-items:center;gap:2px}
.btn{font:500 13px var(--sans);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--line-strong);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--infer);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default}
.pager .btn{padding:3px 11px;font-size:16px;line-height:1.25}
#pos{font:500 13px var(--mono);color:var(--ink-2);min-width:52px;text-align:center;font-variant-numeric:tabular-nums}

.stage{flex:1;min-height:0;padding-inline:clamp(16px,2.4vw,36px);padding-block:0 clamp(12px,2vh,24px)}
.page{height:100%}
.fig{height:100%;margin:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.scroll{flex:1;min-height:400px;position:relative}
.dg{position:absolute;left:16px;top:16px;width:calc(100% - 32px);height:calc(100% - 32px)}
.fig figcaption{border-top:1px solid var(--line);padding:11px 20px 13px;color:var(--ink-2);font-size:14px}
.fig figcaption p{max-width:120ch;margin:0}
.fig figcaption.cap2{display:flex;align-items:center;flex-wrap:wrap;gap:10px 20px}
.cap2 p{flex:1;min-width:min(100%,280px)}
code{font-family:var(--mono);font-size:.9em;background:var(--file-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

/* 좁거나 낮은 화면: 화면 맞춤 대신 흐름도를 읽을 수 있는 크기로 두고 그림 안에서 가로 스크롤 */
@media (max-width:960px),(max-height:540px){
  html,body{height:auto}
  .stage{flex:none}
  .page,.fig{height:auto}
  .scroll{flex:none;min-height:0;overflow-x:auto;padding:16px}
  .dg{position:static;display:block;width:1240px;height:auto}
}

/* diagram */
.dg text{font-family:var(--sans);font-size:12px;fill:var(--ink)}
.dg .t{font-size:13px;font-weight:600}
.dg .s{font-size:11.5px;fill:var(--ink-2)}
.dg .x{font-size:10.5px;fill:var(--ink-2)}
.dg .m{font-family:var(--mono);font-size:12px;font-weight:600}
.dg .ms{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
.dg .c{text-anchor:middle}
.dg .e{text-anchor:end}
.dg .b6{font-weight:600}
.dg .k-infer{fill:var(--infer)}
.dg .k-skill{fill:var(--skill)}
.dg .k-run{fill:var(--run)}
.dg .k-ref{fill:var(--ref)}
.dg .k-review{fill:var(--review)}
.dg .k-file{fill:var(--file)}
.dg .box{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.dg .g-skill{fill:var(--skill-bg);stroke:var(--skill);stroke-width:1.5}
.dg .g-run{fill:var(--run-bg);stroke:var(--run);stroke-width:1.5}
.dg .g-ref{fill:var(--ref-bg);stroke:var(--ref);stroke-width:1.5}
.dg .b-skill{fill:var(--surface);stroke:var(--skill);stroke-width:1.5}
.dg .b-run{fill:var(--surface);stroke:var(--run);stroke-width:1.5}
.dg .b-ref{fill:var(--surface);stroke:var(--ref);stroke-width:1.25}
.dg .b-review{fill:var(--review-bg);stroke:var(--review);stroke-width:1.5}
.dg .d-infer{fill:var(--infer-bg);stroke:var(--infer);stroke-width:1.75}
.dg .c-infer{fill:var(--infer-bg);stroke:var(--infer);stroke-width:1.25}
.dg .c-run{fill:var(--run-bg);stroke:var(--run);stroke-width:1.25}
.dg .c-skill{fill:var(--skill-bg);stroke:var(--skill);stroke-width:1.25}
.dg .f{fill:var(--file-bg);stroke:var(--file);stroke-width:1.5}
.dg .p-fail{fill:var(--review-bg);stroke:var(--review);stroke-width:1.5}
.dg .p-wait{fill:var(--skill-bg);stroke:var(--skill);stroke-width:1.5}
.dg .p-ok{fill:var(--run-bg);stroke:var(--run);stroke-width:1.5}
.dg .ln{fill:none;stroke:var(--line-strong);stroke-width:1.5}
.dg .ln-skill{stroke:var(--skill)}
.dg .ln-infer{stroke:var(--infer);stroke-width:2}
.dg .ln-ref{stroke:var(--ref)}
.dg .ln-review{stroke:var(--review);stroke-width:2}
.dg .ln-file{stroke:var(--file)}
.dg .ln-thin{stroke:var(--line);stroke-width:1}
.dg .dash{stroke-dasharray:5 4}
.dg .mk-ink{fill:var(--line-strong)}
.dg .mk-skill{fill:var(--skill)}
.dg .mk-infer{fill:var(--infer)}
.dg .mk-ref{fill:var(--ref)}
.dg .mk-review{fill:var(--review)}

/* 2쪽 · 판독과 판단 */
.dg .ink{fill:var(--ink)}
.dg .t2{font-size:15px;font-weight:600}
.dg .dt{font-size:21px;font-weight:700;letter-spacing:.35em}
.dg .lb{font-size:11px;fill:var(--ink-3)}
.dg .val{font-size:13px;font-weight:500}
.dg .num{font-family:var(--mono);font-size:11px}
.dg .rt{font-size:16px;font-weight:600}
.dg .vt{font-size:16px;font-weight:700;fill:var(--surface)}
.dg .vs{font-size:12px;font-weight:700;fill:var(--surface)}
.dg .nt{font-size:12px;font-weight:700;fill:var(--surface);text-anchor:middle}
.dg .n-ink{fill:var(--line-strong)}
.dg .n-infer{fill:var(--infer)}
.dg .g-infer{fill:var(--infer-bg);stroke:var(--infer);stroke-width:1.5}
.dg .b-infer{fill:var(--surface);stroke:var(--infer);stroke-width:1.5}
.dg .inner{fill:var(--surface);stroke:var(--line);stroke-width:1}
.dg .v-infer{fill:var(--infer)}
.dg .paper{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.dg .band{fill:var(--file-bg)}
.dg .hl{fill:var(--infer-bg);stroke:var(--infer);stroke-width:1}
.dg .sel{fill:none;stroke:var(--infer);stroke-width:3}
.dg .chk{fill:none;stroke:var(--infer);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.dg .stamp{fill:none;stroke:var(--review);stroke-width:1.25}
.dg .scanline{fill:var(--infer)}
.dg .sg0{stop-color:var(--infer);stop-opacity:0}
.dg .sg1{stop-color:var(--infer);stop-opacity:.3}
.dg .dot{fill:var(--infer)}

/* 애니메이션: 기본 상태가 완성된 그림이고, .play 가 붙으면 순서대로 나타난다 */
.anim .scan{opacity:0}
.anim .dots circle{opacity:0}
.anim .ev{opacity:.55}
.anim.play .a-fade{animation:k-fade .5s ease-out calc(var(--d,0s) + .7s) backwards}
.anim.play .a-up{animation:k-up .55s cubic-bezier(.2,.7,.2,1) calc(var(--d,0s) + .7s) backwards}
.anim.play .a-right{animation:k-right .5s cubic-bezier(.2,.7,.2,1) calc(var(--d,0s) + .7s) backwards}
.anim.play .a-pop{animation:k-pop .45s cubic-bezier(.3,1.4,.5,1) calc(var(--d,0s) + .7s) backwards;transform-box:fill-box;transform-origin:center}
.anim.play .a-type{animation:k-type .6s steps(16,end) calc(var(--d,0s) + .7s) backwards}
.anim.play .scan{animation:k-scan 3s linear calc(var(--d,0s) + .7s) both}
.anim.play .dots circle{animation:k-blink .9s ease-in-out calc(var(--d,0s) + .7s) 4}
.anim.play .ev{animation:k-dim 1.6s ease-out calc(var(--d,0s) + .7s) backwards}
@keyframes k-fade{from{opacity:0}}
@keyframes k-up{from{opacity:0;transform:translateY(12px)}}
@keyframes k-right{from{opacity:0;transform:translateX(-14px)}}
@keyframes k-pop{from{opacity:0;transform:scale(.9)}}
@keyframes k-type{0%{opacity:0;clip-path:inset(-6px 100% -6px -2px)}2%{opacity:1;clip-path:inset(-6px 100% -6px -2px)}100%{opacity:1;clip-path:inset(-6px -2px -6px -2px)}}
@keyframes k-scan{0%{opacity:0;transform:translateY(0)}6%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translateY(352px)}}
@keyframes k-blink{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes k-dim{0%{opacity:0;transform:translateY(12px)}25%{opacity:1;transform:none}70%{opacity:1}100%{opacity:.55}}

/* 상세 보기 전환: 전체 흐름(#ov)은 왼쪽 아래 미니맵으로 줄고, 그 자리에 상세(#dt)가 나타난다 */
#ov{transform-box:view-box;transform-origin:0 0;transition:transform .7s cubic-bezier(.4,0,.2,1)}
.focus #ov{transform:translate(40px,548px) scale(.255)}
#dt,#dt2{opacity:0;visibility:hidden;transition:opacity .25s ease,visibility 0s .25s}
.v-input #dt,.v-author #dt2{opacity:1;visibility:visible;transition:opacity .4s ease .4s,visibility 0s}
.dg .mm-bg{fill:var(--surface);stroke:var(--line-strong);stroke-width:5;opacity:0;transition:opacity .4s}
.dg .mm-here{fill:var(--infer);fill-opacity:.14;stroke:var(--infer);stroke-width:8;opacity:0;pointer-events:none;transition:opacity .4s}
.dg .mm-hit{fill:transparent;pointer-events:none}
.focus .mm-bg{opacity:1}
.v-input .h-input,.v-author .h-author{opacity:1;transition-delay:.5s}
.focus .mm-hit{pointer-events:all;cursor:zoom-out}

/* 누를 수 있는 상자 */
.dg .hot{cursor:pointer;outline:none}
.dg .hot .hot-box{transition:stroke .15s,stroke-width .15s}
.dg .hot:hover .hot-box,.dg .hot:focus-visible .hot-box{stroke:var(--infer);stroke-width:2.5}
.dg .hot-dot{fill:var(--infer);stroke:var(--surface);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:k-hint 1.6s ease-in-out .8s 3}
.dg .hot-tri{fill:var(--surface);pointer-events:none}
@keyframes k-hint{50%{transform:scale(1.3)}}

/* '동작 줄이기' 설정으로 재생을 끄지 않는다. 원격 데스크톱 세션은 그 설정이 기본으로 켜져 있어서,
   끄는 규칙을 두면 흐름 재생 · 상세 재생 · 채우기가 통째로 움직이지 않는다. 재생은 모두 눌러서 시작한다 */

/* 상세 보기 2 · 구조화, 조립, 러너 호출 */
.dg .y{font-family:var(--mono);font-size:11px}
.dg .ph{fill:var(--ink-3)}
.dg .r-infer{fill:var(--infer-bg)}
.dg .n-skill{fill:var(--skill)}
.dg .n-run{fill:var(--run)}
.dg .v-skill{fill:var(--skill)}
.dg .mk-run{fill:var(--run)}
.dg .ln-run{stroke:var(--run)}

/* 구조화 상자의 'YAML 구조' 버튼 */
.dg .ybtn{cursor:pointer;outline:none}
.dg .ybtn rect{fill:var(--surface);stroke:var(--file);stroke-width:1.25;transition:fill .15s}
.dg .ybtn text{font-size:10.5px;font-weight:600;fill:var(--file);text-anchor:middle}
.dg .ybtn:hover rect,.dg .ybtn:focus-visible rect{fill:var(--file-bg);stroke-width:2}

/* 조립된 입력 YAML: 구역 줄도 누를 수 있고, 전체 보기는 넓은 화면에서 두 단으로 */
.dg .yrow{cursor:pointer;outline:none}
.dg .yrow:hover .inner,.dg .yrow:focus-visible .inner{stroke:var(--file);stroke-width:2}
/* 그림 안 재생 2의 입력 YAML 카드: 'YAML 보기'(눈에 띄게 채운 버튼)와 구역 줄만 누를 수 있다 */
.dg .scene.on .ybtn,.dg .scene.on .yrow{pointer-events:auto}
.dg .ybtn.go rect{fill:var(--infer);stroke:var(--infer)}
.dg .ybtn.go text{fill:var(--surface)}
.dg .ybtn.go:hover rect,.dg .ybtn.go:focus-visible rect{fill:var(--infer);stroke:var(--ink);stroke-width:1.5}

/* YAML 구조: 그림 안 오른쪽 칸 자리에만 뜨는 작은 창. 위치·크기·글자 크기는 스크립트가 그림 배율에 맞춘다 */
.ypop{position:absolute;z-index:5;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;font-size:11px;background:var(--surface);border:.14em solid var(--file);border-radius:.8em}
.ypop .yhead{display:flex;align-items:flex-start;gap:.6em;padding:.75em .8em .45em}
.ypop .ytabs{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:.35em}
.ypop .ytab{font:500 .95em var(--sans);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99em;padding:.25em .85em;cursor:pointer}
.ypop .ytab:hover{border-color:var(--line-strong);color:var(--ink)}
.ypop .ytab:focus-visible,.ypop .yx:focus-visible{outline:2px solid var(--infer);outline-offset:1px}
.ypop .ytab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ypop .yx{flex:none;width:1.5em;height:1.5em;padding:0;font:500 1.25em/1 var(--sans);color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:50%;cursor:pointer}
.ypop .yx:hover{border-color:var(--line-strong);color:var(--ink)}
.ypop .ypath{padding:0 1em .6em;font:500 .92em var(--mono);color:var(--ink-3)}
.ypop .ybody{flex:1;min-height:0;overflow:auto;background:var(--file-bg);border-top:1px solid var(--line)}
.ypop pre.yaml{margin:0;padding:.9em 1.1em 1.2em;font:500 1em/1.5 var(--mono);color:var(--ink);white-space:pre;tab-size:2}
.ypop pre.yaml .yk{color:var(--infer)}
.ypop pre.yaml .yc{color:var(--ink-3);font-weight:400}
.ypop pre.yaml .yp{color:var(--skill)}

/* 같은 곳 표시: 상세 보기 2의 '레시피 · 레지스트리' 재료 상자 = 미니맵의 보라색 두 묶음 */
.dg .mm-same{fill:var(--ref);fill-opacity:.16;stroke:var(--ref);stroke-width:8;opacity:0;pointer-events:none}
.v-author .mm-same{opacity:1}
.dg .dot-ref{fill:var(--ref)}
#same2{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility 0s .25s}
.v-author #same2{opacity:1;visibility:visible;transition:opacity .4s ease .4s,visibility 0s}

/* YAML 창의 '채우기': 빈 자리(.slot)에 값이 한 글자씩 들어가고, 출처 색으로 남는다 */
.ypop .yfill{flex:none;font:600 .95em var(--sans);color:var(--surface);background:var(--infer);border:1px solid var(--infer);border-radius:99em;padding:.25em 1em;cursor:pointer}
.ypop .yfill:hover:not(:disabled){filter:brightness(1.1)}
.ypop .yfill:disabled{opacity:.65;cursor:default}
.ypop .yfill:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.ypop .ypath{display:flex;justify-content:space-between;gap:1em}
.ypop #ystate{font-family:var(--sans);color:var(--ink-2)}
.ypop .slot{position:relative;border-radius:.25em}
.ypop .slot.filling{background:var(--surface);box-shadow:0 0 0 .12em var(--infer)}
.ypop .slot.filling::after{content:"";position:absolute;left:100%;top:.22em;width:.45em;height:1.05em;margin-left:.1em;background:var(--infer);animation:k-caret .7s steps(1) infinite}
@keyframes k-caret{50%{opacity:0}}
.ypop .slot.filled{font-weight:600}
.ypop .slot.filled[data-src="q"],.ypop .yfoot .q{color:var(--infer);background:var(--infer-bg)}
.ypop .slot.filled[data-src="u"],.ypop .slot.filled[data-src="a"],.ypop .yfoot .u{color:var(--skill);background:var(--skill-bg)}
.ypop .slot.filled[data-src="r"],.ypop .yfoot .r{color:var(--ref);background:var(--ref-bg)}
.ypop .slot.filled[data-src="c"],.ypop .slot.filled[data-src="n"],.ypop .yfoot .c{color:var(--run);background:var(--run-bg)}
.ypop .slot.filled[data-src="f"],.ypop .yfoot .f{color:var(--ink);background:var(--surface)}
.ypop .yfoot{display:flex;flex-wrap:wrap;gap:.3em .5em;padding:.5em .8em .6em;border-top:1px solid var(--line);font-size:.9em}
.ypop .yfoot span{padding:.1em .55em;border-radius:.3em;font-weight:600}

/* 채우는 값의 근거: 창 아래 한 줄에 가져온 곳을 적고, 왼쪽 재료 상자에 불을 켠다 */
.ypop .ywhy{display:flex;align-items:baseline;gap:.7em;padding:.55em .9em;border-top:1px solid var(--line);background:var(--surface);min-height:1.6em}
.ypop .ywhy b{flex:none;font-weight:700;color:var(--ink-2)}
.ypop .ywhy span{min-width:0;color:var(--ink-3)}
.ypop .ywhy.q span{color:var(--infer);font-weight:600}
.ypop .ywhy.u span,.ypop .ywhy.a span{color:var(--skill);font-weight:600}
.ypop .ywhy.r span{color:var(--ref);font-weight:600}
.ypop .ywhy.c span,.ypop .ywhy.n span{color:var(--run);font-weight:600}
.ypop .ywhy.f span{color:var(--ink);font-weight:600}
.ypop .slot.filled{cursor:help}
.dg .srcbox{transition:stroke-width .15s}
.dg .srcbox.lit{stroke-width:5}

/* 흐름 재생: 전체 흐름의 연결선을 따라 순서대로 한 번씩 흘러 들어간다 */
.dg .pbtn{fill:var(--surface);stroke:var(--infer);stroke-width:1.5}
.dg .n-review{fill:var(--review)}
.dg .n-file{fill:var(--file)}
.dg .fl{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:.22 1;stroke-dashoffset:.22;opacity:0;pointer-events:none}
.dg .f-ink{stroke:var(--line-strong)}
.dg .f-infer{stroke:var(--infer)}
.dg .f-skill{stroke:var(--skill)}
.dg .f-ref{stroke:var(--ref)}
.dg .f-run{stroke:var(--run)}
.dg .nd{opacity:0;pointer-events:none}
.dg .fl.alt{stroke-opacity:.4}
.dg .nd.alt{fill-opacity:.4}
.flowing .fl{animation:k-flow var(--t,1s) cubic-bezier(.4,0,.6,1) var(--d,0s) both}
.flowing .nd{animation:k-nd 1s ease-out var(--d,0s) both}
@keyframes k-flow{0%{opacity:0;stroke-dashoffset:.22}8%{opacity:1}92%{opacity:1}100%{opacity:0;stroke-dashoffset:-1}}
@keyframes k-nd{0%{opacity:0}35%{opacity:.3}100%{opacity:0}}

/* 그림 안 재생(.scene): 전체 흐름 그림 위에서 한 단계의 과정을 보여 준다
   (#ocrfx 견적서 이미지 · #yamlfx 입력 사전 작성 · #fixfx 중단했을 때 · #opsfx 레시피 · 레지스트리 업데이트 · #modelfx 모델별 성능).
   묶음에 .on 이 붙어 있는 동안만 보이고, 다 재생된 모습으로 남는다.
   .p-in · .p-pop · .p-type 은 끝까지 남는 표시, .hold · .pulse · .fl · .nd · .scan2 는 지나가는 표시 */
.dg .f-review{stroke:var(--review)}
.dg .f-file{stroke:var(--file)}
.dg .n-ref{fill:var(--ref)}
.dg .ring{fill:none;stroke-width:3}
.dg .ring.thin{stroke-width:1.5}
.dg .rowhl{fill:var(--review);fill-opacity:.14;stroke:var(--review);stroke-width:1.25}
.dg .rowhl.i{fill:var(--infer);stroke:var(--infer)}
.dg .rowhl.u{fill:var(--skill);stroke:var(--skill)}
.dg .rowhl.r{fill:var(--ref);stroke:var(--ref)}
.dg .rowhl.g{fill:var(--run);stroke:var(--run)}
/* 그림 안 재생 2: 순서 표(.sd 동그라미 + .nt 숫자)와 입력 YAML 카드의 출처 표(.ct · 판독 = 파랑, 참조 = 보라) */
.dg .sd{fill:var(--skill);stroke:var(--surface);stroke-width:2}
.dg .ct{font-size:10px;font-weight:700;fill:var(--surface);text-anchor:middle}
.dg .chk.ok{stroke:var(--run)}
.dg .mini{font-size:8px;font-weight:700;letter-spacing:.25em}
.dg .tl{fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.dg .tl.b{stroke:var(--ink);stroke-width:2.5}
/* 스킬 단계 표시: 1단계 = 라우터 스킬(LLM 라우터가 고른다), 2단계 = 실무 스킬(1단계 스킬이 고른다).
   2단계 상자는 들여 쓰고, 단계 표(.lv)는 재생 표시보다 위에 그린다. 탈락한 실무 스킬은 표도 함께 흐려진다 */
.dg .opt{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--ink-2)}
.dg .lv text{font-size:10.5px;font-weight:700;fill:var(--skill);text-anchor:middle}
.dg .lv.l1 text{fill:var(--surface)}
.dg .lv{pointer-events:none;transition:opacity .2s}
.dg #ocrfx.on ~ .lv.out{opacity:.35;transition:opacity .45s ease-out 11.8s}
.dg #ocrfx.on.done ~ .lv.out{transition:none}
.dg .cover{fill:var(--surface)}
.dg .dim{fill:var(--surface);opacity:.62}
.dg .hl.sk{fill:var(--skill-bg);stroke:var(--skill)}
.dg .chk.sk{stroke:var(--skill)}
.dg .hit{fill:transparent;stroke:transparent}
.dg .scene{opacity:0;visibility:hidden;pointer-events:none}
.dg .scene.on{opacity:1;visibility:visible}
.dg .scene .hold,.dg .scene .pulse,.dg .scene .think circle,.dg .scene .scan2{opacity:0}
.dg .scene.on .p-in{animation:k-fade .45s ease-out var(--d,0s) backwards}
.dg .scene.on .p-pop{animation:k-pop .45s cubic-bezier(.3,1.4,.5,1) var(--d,0s) backwards;transform-box:fill-box;transform-origin:center}
.dg .scene.on .p-type{animation:k-type .6s steps(16,end) var(--d,0s) backwards}
.dg .scene.on .hold{animation:k-hold var(--t,1s) linear var(--d,0s) both}
.dg .scene.on .pulse{animation:k-ring 1.6s ease-out var(--d,0s) both}
.dg .scene.on .fl{animation:k-flow var(--t,1s) cubic-bezier(.4,0,.6,1) var(--d,0s) both}
.dg .scene.on .nd{animation:k-nd 1s ease-out var(--d,0s) both}
.dg .scene.on .think circle{animation:k-blink .9s ease-in-out var(--d,0s) 4}
.dg .scene.on .scan2{animation:k-scan2 2.4s linear var(--d,0s) both}
@keyframes k-hold{0%{opacity:0}4%{opacity:1}96%{opacity:1}100%{opacity:0}}
@keyframes k-ring{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
@keyframes k-scan2{0%{opacity:0;transform:translateY(0)}6%{opacity:1}92%{opacity:1}100%{opacity:0;transform:translateY(110px)}}

/* 그림 안 재생 5 · 모델별 성능(#modelfx): LLM OCR 카드 자리에서 모델마다 표본 판독 → 정확도 막대 → 적합 · 부적합 순서로 나온다.
   재생 묶음 안의 버튼(.hot)은 묶음이 켜져 있는 동안만 눌린다. .done 은 재생 없이 다 재생된 모습으로 바로 켠다 */
.dg .scene.on .hot{pointer-events:auto}
.dg .scene.on.done *{animation:none!important}
.dg .track{fill:var(--surface);stroke:var(--line);stroke-width:1}
.dg .tick{fill:none;stroke:var(--ink);stroke-width:1.5}
.dg .tile{fill:var(--run-bg);stroke:var(--run);stroke-width:1}
.dg .tile.bad{fill:var(--review);stroke:var(--review)}
.dg .tile.w1{fill-opacity:.25}
.dg .tile.w2{fill-opacity:.45}
.dg .tile.w3{fill-opacity:.7}
.dg .scene.on .p-grow{animation:k-grow .7s cubic-bezier(.3,.6,.3,1) var(--d,0s) backwards;transform-box:fill-box;transform-origin:0 50%}
@keyframes k-grow{from{transform:scaleX(0)}}
</style>

        <div class="ywhy" id="ywhy"><b>근거</b><span id="ywhytext">채우기를 누르면 값마다 가져온 곳이 나온다</span></div>

          <span class="f">양식 고정</span>

    <figcaption class="cap2">
      <p id="cap-ov"><strong>상세 흐름.</strong> LLM은 판정하고 입력 파일을 쓰는 데까지만 관여한다. 이미지는 입력 YAML과 증빙 PDF 두 파일로 굳고, 러너는 그 파일과 레지스트리만 읽어 임시저장까지 간다. 위임전결과 문서설정은 입력에 적힌 키(<code>amount</code>, <code>purpose</code>, <code>document_setting</code>)를 코드가 해석해서 정한다. 왼쪽의 '흐름 재생'을 누르면 연결선을 따라 차례로 흘러 들어가는 모습이 나온다. 파란 ▶ 가 붙은 상자('견적서 이미지', '입력 사전 작성', 'fail → 중단 · 보고', '레시피', '레지스트리')를 누르면 그 단계의 과정이 이 그림 안에서 재생된다.</p>
      <p id="cap-ops" data-view="ops" hidden><strong>레시피 · 레지스트리 업데이트.</strong> 레시피와 레지스트리는 업무 스킬과 별개인 운영 스킬이 웹(KRS eclass 등)에서 수집해 업데이트한다. 화면을 읽어 저장해 둔 값과 달라진 곳을 찾고, 파일을 고친 뒤 검증한다. 고친 값은 다음 품의부터 스킬과 러너가 그대로 읽는다. 새 양식을 탐사해 레시피를 만드는 <code>ea-type-add</code>가 그런 운영 스킬의 예다.</p>
      <p id="cap-ocr" data-view="ocr" hidden><strong>입력에서 판단까지.</strong> 견적서 이미지와 요청을 받으면 LLM이 이미지의 글자를 직접 읽고(LLM OCR), 무슨 자료인지 추론한다. 스킬 선택은 두 번 일어난다. 먼저 LLM 라우터가 스킬 후보들의 description과 대조해 ea-router를 고르고, 이어서 ea-router(스킬)가 구매요청서인지 구매승인 품의인지 판정해 실무 스킬을 고른다. 이 단계의 판독은 판정에 필요한 만큼만 한다. 견적서와 요청 문장은 설명용 예시다. 카드의 '모델별 성능'을 누르면 모델마다 읽기 성능과 적합 여부가 나온다.</p>
      <p id="cap-model" data-view="model" hidden><strong>모델별 읽기 성능.</strong> 카드 영수증 세 장(또렷한 것, 작고 흐린 것, 더 작고 더 흐린 것), 숙박 영수증 PDF, 왕복 항공권, 기차표 여섯 표본을 모델마다 두 번씩 읽혀 182칸을 채점했다. 막대는 맞은 칸의 비율이고, 그 아래 숫자는 한 장을 읽는 데 걸린 시간(중앙값)과 호출 한 번의 비용(첫 호출, CLI 표시값)이다. 지금 설정인 Haiku 4.5는 흐린 영수증에서 많이 틀려 81%였고, effort low로 돌린 Sonnet 5.5 · Opus 5.5 · Fable 5.1은 98~100%였다. 적합 여부는 정확도 95% 이상을 기준으로 표시했다.</p>
      <p id="cap-yaml" data-view="yaml" hidden><strong>스킬 실행에서 러너 호출까지.</strong> ① ea-router가 고른 실무 스킬이 ② 실행되면, LLM OCR이 견적서에서 읽어 구조화해 둔 판독값과 이미 있는 참조값(레시피 양식 · 레지스트리 키)을 받는다. ③ 스킬은 두 값을 조합해 입력 YAML 한 파일을 만들고, 어디에도 없는 값은 추측하지 않고 사용자에게 묻는다. ④ 그다음 스킬이 러너를 호출하고, 러너는 그 파일만 읽어 validate, run-dry, run 순서로 임시저장까지 간다. 카드의 'YAML 보기'나 구역 줄을 누르면 작성된 YAML이 오른쪽에 뜬다. 값은 설명용 예시다.</p>
      <p id="cap-fix" data-view="fix" hidden><strong>중단했을 때.</strong> 러너가 실행 중에 멈추면 fail로 끝나고 보고를 남긴다(exit 5 · 런타임 스텝 실패). Claude SDK가 그 보고(verdict · exit code · logs)를 확인해 멈춘 스텝과 원인을 찾고, 러너를 업데이트한 뒤 validate, run-dry, run 순서로 다시 실행한다. 종점은 그대로 임시저장이고 상신은 사람이 한다.</p>
      <p id="cap-dt" data-view="input" hidden><strong>입력에서 판단까지.</strong> 견적서 이미지와 요청을 받으면 LLM이 이미지의 글자를 직접 읽고(LLM OCR), 무슨 자료인지 추론해 스킬을 고른다. 이 단계의 판독은 판정에 필요한 만큼만 한다. 그림 속 견적서와 요청 문장은 설명용 예시다.</p>
      <p id="cap-author" data-view="author" hidden><strong>구조화에서 러너 호출까지.</strong> 앞 단계에서 선택된 스킬이 앞 단계의 견적 판독값, 사용자 확인, 레시피·레지스트리를 재료로 과제 · 공문내용 · 문서설정 · 위임전결 · 첨부 다섯 구역을 채운다. 다섯 구역은 입력 YAML 한 파일로 조립되고, 러너는 그 파일만 읽어 validate, run-dry, run 순서로 임시저장까지 간다. 'YAML 구조' 버튼을 누르면 그 구역의 YAML이 오른쪽 칸에 뜨고, '채우기'를 누르면 빈 구조에 값이 채워진다. 값마다 가져온 곳을 창 아래 '근거' 줄에 적고, 왼쪽의 해당 재료 상자를 굵게 표시한다. 값은 설명용 예시다.</p>
      <button class="btn" id="detail" type="button" hidden>상세 보기</button>
      <button class="btn" id="replay" type="button" hidden>다시 재생</button>
      <button class="btn" id="back" type="button" hidden>전체 흐름으로</button>
    </figcaption>
  </figure>
  </section>
</main>

<script>
(function(){
  /* 쪽 넘김: 쪽이 둘 이상일 때만 보인다 */
  var pages=[].slice.call(document.querySelectorAll('.page')),cur=-1;
  var ttl=document.getElementById('ttl'),pos=document.getElementById('pos');
  var prev=document.getElementById('prev'),next=document.getElementById('next');
  function show(i){
    i=Math.max(0,Math.min(pages.length-1,i));
    if(i===cur)return;
    cur=i;
    pages.forEach(function(p,k){p.hidden=k!==i;});
    ttl.textContent=pages[i].getAttribute('data-title');
    pos.textContent=(i+1)+' / '+pages.length;
    prev.disabled=i===0;
    next.disabled=i===pages.length-1;
  }
  if(pages.length<2)document.querySelector('.pager').hidden=true;
  prev.addEventListener('click',function(){show(cur-1);});
  next.addEventListener('click',function(){show(cur+1);});
  show(0);

  /* 그림 안 재생(scene): ▶ 상자를 누르면 전체 흐름 그림 위에서 그 단계의 과정이 재생된다 (1 · 2 · 3 · 4 · 5 키)
     ocr  = 견적서 이미지 → LLM OCR → 판단 · 스킬 선택
     yaml = 스킬 선택 · 실행 → 판독값 + 참조값 조합 → 입력 YAML → 러너 호출
     fix  = 러너 중단 → Claude SDK 가 보고 확인 → 러너 업데이트 → 다시 실행
     ops  = 운영 스킬이 웹에서 수집 → 대조 → 레시피 · 레지스트리 업데이트
     model = LLM OCR 카드의 '모델별 성능' → 모델마다 표본 판독 · 정확도 · 시간 · 비용 → 적합 · 부적합
     상세 보기(view): 재생 중 '상세 보기'를 누르면 전체 흐름이 미니맵으로 줄고 큰 그림이 재생된다
     input = ocr 의 큰 그림, author = yaml 의 큰 그림 (구역별 YAML 구조 · 채우기) */
  var svg=document.getElementById('flow');
  var scenes={ocr:{fx:'ocrfx',detail:'input'},yaml:{fx:'yamlfx',detail:'author'},fix:{fx:'fixfx'},ops:{fx:'opsfx'},model:{fx:'modelfx'}};
  var details={input:true,author:true};
  var capOv=document.getElementById('cap-ov');
  var caps=[].slice.call(document.querySelectorAll('p[data-view]'));
  var replay=document.getElementById('replay'),back=document.getElementById('back'),detailBtn=document.getElementById('detail');
  var view=null,scene=null;
  function play(){
    svg.classList.remove('play');
    void svg.getBoundingClientRect();
    svg.classList.add('play');
  }
  function setHash(h){
    try{history.replaceState(null,'',h||(location.pathname+location.search));}catch(e){}
  }
  function sync(){
    var shown=view||scene;
    capOv.hidden=!!shown;
    caps.forEach(function(c){c.hidden=c.getAttribute('data-view')!==shown;});
    replay.hidden=!shown;
    back.hidden=!shown;
    back.textContent=scene?'재생 끝내기':'전체 흐름으로';
    detailBtn.hidden=!(scene&&scenes[scene].detail);
  }
  /* 흐름 재생: 전체 흐름에서 연결선을 따라 차례로 흘러 들어가는 모습 (약 12초, 다시 누르면 처음부터) */
  var flowBtn=document.getElementById('flowbtn'),flowTimer=null;
  function stopFlow(){clearTimeout(flowTimer);svg.classList.remove('flowing');}
  function playFlow(){
    if(view)return;
    stopScene();
    stopFlow();
    void svg.getBoundingClientRect();
    svg.classList.add('flowing');
    flowTimer=setTimeout(stopFlow,12500);
  }
  if(flowBtn){
    flowBtn.addEventListener('click',playFlow);
    flowBtn.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();playFlow();}
    });
  }

  /* 그림 안 재생: 그 단계의 표시 묶음(.scene)에 .on 을 붙이면 순서대로 나타난다 (10~20초, 다시 누르면 처음부터).
     다 재생된 모습으로 남고, Esc 나 '재생 끝내기'로 끈다. 한 번에 하나만 켠다 */
  function sceneEl(s){return document.getElementById(scenes[s].fx);}
  function stopScene(){
    if(!scene)return;
    if(panel&&!panel.hidden)closeYaml();
    sceneEl(scene).classList.remove('on');
    scene=null;
    sync();
    setHash('');
  }
  /* done 을 주면 재생 없이 다 재생된 모습으로 바로 켠다 */
  function playScene(s,done){
    if(view||!scenes[s])return;
    stopFlow();
    if(panel&&!panel.hidden)closeYaml();
    if(scene)sceneEl(scene).classList.remove('on');
    var g=sceneEl(s);
    void svg.getBoundingClientRect();
    g.classList[done?'add':'remove']('done');
    g.classList.add('on');
    scene=s;
    sync();
  }
  var triggers={'open-input':'ocr','open-author':'yaml','open-fix':'fix','fixbtn':'fix','open-ops-a':'ops','open-ops-b':'ops','open-model':'model'};
  Object.keys(triggers).forEach(function(id){
    var el=document.getElementById(id);
    if(!el)return;
    el.addEventListener('click',function(){playScene(triggers[id]);});
    el.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();playScene(triggers[id]);}
    });
  });

  /* 모델별 성능 카드의 '판독 보기': 견적서를 읽는 카드로 돌아간다 (다시 재생하지 않고 다 읽은 모습으로) */
  var backOcr=document.getElementById('back-ocr');
  if(backOcr){
    backOcr.addEventListener('click',function(){playScene('ocr',true);});
    backOcr.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();playScene('ocr',true);}
    });
  }

  function openDetail(v){
    if(view===v||!details[v])return;
    stopFlow();
    stopScene();
    if(!view&&bodies)bodies.forEach(function(b){emptyAll(b);});  /* 상세 보기의 YAML 창은 빈 구조부터 */
    if(view)svg.classList.remove('v-'+view);
    view=v;
    svg.classList.add('focus');
    svg.classList.add('v-'+v);
    play();
    sync();
    setHash('#'+v);
  }
  function closeDetail(){
    if(!view)return;
    closeYaml();
    svg.classList.remove('v-'+view);
    svg.classList.remove('focus');
    svg.classList.remove('play');
    view=null;
    sync();
    setHash('');
  }
  svg.querySelector('.mm-hit').addEventListener('click',closeDetail);
  back.addEventListener('click',function(){if(scene)stopScene();else closeDetail();});
  replay.addEventListener('click',function(){if(scene)playScene(scene);else play();});
  detailBtn.addEventListener('click',function(){if(scene&&scenes[scene].detail)openDetail(scenes[scene].detail);});

  /* YAML 창: 'YAML 구조' 버튼 → 그림 안 오른쪽 칸 자리에 그 구역의 YAML 하나 */
  var panel=document.getElementById('ypanel');
  var tabs=[].slice.call(panel.querySelectorAll('.ytab'));
  var bodies=[].slice.call(panel.querySelectorAll('.ybody'));
  var fillBtn=document.getElementById('yfill'),stateEl=document.getElementById('ystate');
  var current=null;

  /* 색칠: 키 · 주석 · <자리표시자>, 그리고 [[빈 값|채울 값|출처]] → 채우기 자리(.slot) */
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function escA(s){return esc(s).replace(/"/g,'&quot;');}
  function mark(s){
    return s.replace(/&lt;[^&]*?&gt;/g,function(m){return '<span class="yp">'+m+'</span>';});
  }
  function inline(s){
    var out='',re=/\[\[(.*?)\|(.*?)\|(\w)(?:\|(.*?))?\]\]/g,last=0,m;
    while((m=re.exec(s))){
      out+=mark(esc(s.slice(last,m.index)));
      out+='<span class="slot" data-src="'+m[3]+'" data-empty="'+escA(m[1])+'" data-fill="'+escA(m[2])+'" data-why="'+escA(m[4]||'')+'">'+esc(m[1])+'</span>';
      last=re.lastIndex;
    }
    return out+mark(esc(s.slice(last)));
  }
  function paint(src){
    var block=-1;
    return src.split('\n').map(function(line){
      var indent=line.search(/\S/);
      if(block>=0){
        if(indent<0||indent>block)return inline(line);
        block=-1;
      }
      var c='',i=line.search(/(^|\s)#/);
      if(i>=0){if(line.charAt(i)!=='#')i++;c=line.slice(i);line=line.slice(0,i);}
      if(/:\s*\|[0-9+-]*\s*$/.test(line))block=indent;
      var k=/^(\s*(?:-\s+)?(?:\{\s*)?)([^\s:#<\-{\[][^:#]*?)(:)(?=\s|$)/.exec(line),out;
      if(k)out=esc(k[1])+'<span class="yk">'+esc(k[2])+'</span>:'+inline(line.slice(k[0].length));
      else out=inline(line);
      return out+(c?'<span class="yc">'+inline(c)+'</span>':'');
    }).join('\n');
  }
  [].forEach.call(panel.querySelectorAll('pre.yaml'),function(p){p.innerHTML=paint(p.textContent);});

  /* 채우기 자리 뒤의 빈칸(주석 앞)을 기억해 두고, 값이 길어지면 그만큼 줄여 주석 줄을 맞춘다 */
  function cols(s){var n=0;for(var i=0;i<s.length;i++)n+=s.charCodeAt(i)>0x2E7F?1.67:1;return n;}
  function slotsOf(body){return [].slice.call(body.querySelectorAll('.slot'));}
  [].forEach.call(panel.querySelectorAll('.slot'),function(s){
    var t=s.nextSibling;
    if(t&&t.nodeType===3&&/^ +$/.test(t.nodeValue)&&t.nextSibling&&t.nextSibling.className==='yc')s._pad=t.nodeValue.length;
  });
  function setSlot(s,text){
    s.textContent=text;
    if(s._pad!=null){
      var n=Math.max(2,Math.round(s._pad-(cols(text)-cols(s.getAttribute('data-empty')))));
      s.nextSibling.nodeValue=new Array(n+1).join(' ');
    }
  }
  /* 근거 표시: 값마다 가져온 곳을 창 아래 한 줄에 적고, 그림 왼쪽의 재료 상자(견적 판독값 · 사용자 확인 · 레시피·레지스트리)에 불을 켠다 */
  var whyEl=document.getElementById('ywhy'),whyText=document.getElementById('ywhytext');
  var WHY={q:'견적 판독값 (LLM OCR)',u:'사용자 확인',a:'스킬 저작 · 레시피 관례',r:'저장해 둔 레지스트리',c:'convert 가 만든 PDF',f:'양식 고정 · input.template.yaml',n:'러너 확정 · 저장해 둔 레지스트리'};
  var BOX={q:'srcbox-q',u:'srcbox-u',r:'srcbox-r',a:'srcbox-r',f:'srcbox-r',n:'srcbox-r'};
  var srcBoxes=[].slice.call(svg.querySelectorAll('.srcbox'));
  function showWhy(s){
    var src=s?s.getAttribute('data-src'):'';
    whyEl.className='ywhy'+(src?' '+src:'');
    whyText.textContent=s?(s.getAttribute('data-why')||WHY[src]||''):(current&&current._filled?'값에 마우스를 올리면 가져온 곳이 나온다':'채우기를 누르면 값마다 가져온 곳이 나온다');
    srcBoxes.forEach(function(b){if(s&&b.id===BOX[src])b.classList.add('lit');else b.classList.remove('lit');});
  }
  panel.addEventListener('mouseover',function(e){
    var s=e.target.closest?e.target.closest('.slot.filled'):null;
    if(s&&current&&!current._busy)showWhy(s);
  });
  panel.addEventListener('mouseout',function(e){
    var s=e.target.closest?e.target.closest('.slot.filled'):null;
    if(s&&current&&!current._busy)showWhy(null);
  });
  panel.addEventListener('click',function(e){
    var s=e.target.closest?e.target.closest('.slot.filled'):null;
    if(s&&current&&!current._busy)showWhy(s);
  });

  function fillAll(body){
    slotsOf(body).forEach(function(s){setSlot(s,s.getAttribute('data-fill'));s.classList.remove('filling');s.classList.add('filled');});
    body._filled=true;body._busy=false;
  }
  function emptyAll(body){
    slotsOf(body).forEach(function(s){setSlot(s,s.getAttribute('data-empty'));s.classList.remove('filling');s.classList.remove('filled');});
    body._filled=false;body._busy=false;
  }
  function syncFill(){
    if(!current)return;
    fillBtn.disabled=!!current._busy;
    fillBtn.textContent=current._busy?'채우는 중':(current._filled?'비우기':'채우기');
    stateEl.textContent=current._busy?(current._runner?'러너가 확정하는 중':'스킬이 채우는 중'):(current._filled?'채움 · 설명용 예시':'빈 구조');
  }
  /* 채우는 순서: 스킬이 적는 값을 위에서부터, 러너가 확정하는 값(n)은 맨 나중에 */
  function ordered(body){
    var all=slotsOf(body);
    return all.filter(function(s){return s.getAttribute('data-src')!=='n';})
      .concat(all.filter(function(s){return s.getAttribute('data-src')==='n';}));
  }

  /* 채우기 쇼: 자리마다 한 글자씩 넣는다. 탭을 바꾸거나 닫으면 진행 중이던 쇼는 끝까지 채운 상태로 멈춘다 */
  var run=0;
  function stopShow(){
    run++;
    bodies.forEach(function(b){if(b._busy)fillAll(b);});
  }
  function keepVisible(body,s){
    var b=body.getBoundingClientRect(),r=s.getBoundingClientRect(),m=r.height*2.5;
    if(r.bottom>b.bottom-m)body.scrollTop+=r.bottom-(b.bottom-m);
    else if(r.top<b.top+m)body.scrollTop-=(b.top+m)-r.top;
  }
  function showFill(body){
    var list=ordered(body),my=++run,i=0;
    emptyAll(body);
    body._busy=true;
    body._runner=false;
    body.scrollTop=0;
    syncFill();
    function nextSlot(){
      if(my!==run)return;
      if(i>=list.length){body._busy=false;body._runner=false;body._filled=true;syncFill();showWhy(null);return;}
      var s=list[i++],text=s.getAttribute('data-fill');
      var byRunner=s.getAttribute('data-src')==='n';
      if(byRunner!==body._runner){body._runner=byRunner;syncFill();}
      showWhy(s);
      var chars=Array.from?Array.from(text):text.split(''),k=0;
      var step=Math.max(10,Math.min(34,560/Math.max(1,chars.length)));
      s.classList.add('filling');
      setSlot(s,'');
      keepVisible(body,s);
      (function type(){
        if(my!==run)return;
        if(k<chars.length){k++;setSlot(s,chars.slice(0,k).join(''));setTimeout(type,step);}
        else{s.classList.remove('filling');s.classList.add('filled');setTimeout(nextSlot,160);}
      })();
    }
    setTimeout(nextSlot,250);
  }
  fillBtn.addEventListener('click',function(){
    if(!current||current._busy)return;
    if(current._filled){emptyAll(current);syncFill();showWhy(null);}
    else showFill(current);
  });

  /* 창은 그림 안의 한 칸 자리에 맞춰 놓는다. 전체 화면을 덮지 않는다.
     상세 보기에서는 #yzone(오른쪽 칸), 그림 안 재생 2에서는 #yzone2(입력 YAML 카드 오른쪽 칸) */
  var zones={detail:document.getElementById('yzone'),scene:document.getElementById('yzone2')};
  var scroller=panel.parentNode;
  function place(){
    var zone=view?zones.detail:zones.scene;
    if(panel.hidden||!zone)return;
    var z=zone.getBoundingClientRect(),s=scroller.getBoundingClientRect();
    panel.style.left=(z.left-s.left+scroller.scrollLeft-scroller.clientLeft)+'px';
    panel.style.top=(z.top-s.top+scroller.scrollTop-scroller.clientTop)+'px';
    panel.style.width=z.width+'px';
    panel.style.height=z.height+'px';
    panel.style.fontSize=(11*z.width/parseFloat(zone.getAttribute('width')))+'px';
  }
  window.addEventListener('resize',place);
  function openYaml(key){
    var shown=null;
    bodies.forEach(function(b){if(b.getAttribute('data-y')===key)shown=b;});
    if(!shown)return;
    stopShow();
    bodies.forEach(function(b){b.hidden=b!==shown;});
    tabs.forEach(function(t){t.setAttribute('aria-pressed',t.getAttribute('data-y')===key?'true':'false');});
    current=shown;
    /* 그림 안 재생에서 열면 작성된 YAML 을 바로 보여 준다 (상세 보기에서는 빈 구조부터) */
    if(!view&&!shown._filled)fillAll(shown);
    panel.hidden=false;
    place();
    shown.scrollTop=0;
    syncFill();
    showWhy(null);
  }
  function closeYaml(){stopShow();panel.hidden=true;showWhy(null);}
  tabs.forEach(function(t){t.addEventListener('click',function(){openYaml(t.getAttribute('data-y'));});});
  document.getElementById('yclose').addEventListener('click',closeYaml);
  [].forEach.call(svg.querySelectorAll('.ybtn,.yrow'),function(b){
    var key=b.getAttribute('data-y');
    b.addEventListener('click',function(){openYaml(key);});
    b.addEventListener('keydown',function(e){
      if(e.key==='Enter'||e.key===' '){e.preventDefault();openYaml(key);}
    });
  });

  document.addEventListener('keydown',function(e){
    if(e.altKey||e.ctrlKey||e.metaKey)return;
    var k=e.key;
    if(k==='Escape'||k==='Backspace'){
      if(!panel.hidden){closeYaml();e.preventDefault();}
      else if(view){closeDetail();e.preventDefault();}
      else if(scene){stopScene();e.preventDefault();}
    }
    else if(k==='r'||k==='R'||k==='ㄱ'){if(view){if(panel.hidden)play();}else if(scene)playScene(scene);}
    else if(k==='f'||k==='F'||k==='ㄹ'){if(!view)playFlow();}
    else if(k==='1'){if(!view)playScene('ocr');}
    else if(k==='2'){if(!view)playScene('yaml');}
    else if(k==='3'||k==='s'||k==='S'||k==='ㄴ'){if(!view)playScene('fix');}
    else if(k==='4'){if(!view)playScene('ops');}
    else if(k==='5'){if(!view)playScene('model');}
    else if(k==='ArrowRight'||k==='PageDown'){if(pages.length>1){show(cur+1);e.preventDefault();}}
    else if(k==='ArrowLeft'||k==='PageUp'){if(pages.length>1){show(cur-1);e.preventDefault();}}
  });

  try{var h=(location.hash||'').replace('#','');if(details[h])openDetail(h);else if(scenes[h])setHash('');}catch(e){}  /* 그림 안 재생은 열자마자 시작하지 않는다 — 눌러야 시작한다 */

  var fs=document.getElementById('fs'),root=document.documentElement;
  if(!document.fullscreenEnabled||!root.requestFullscreen){fs.hidden=true;return;}
  fs.addEventListener('click',function(){
    if(document.fullscreenElement){document.exitFullscreen();return;}
    root.requestFullscreen().catch(function(){fs.hidden=true;});
  });
  document.addEventListener('fullscreenchange',function(){
    fs.textContent=document.fullscreenElement?'전체 화면 끝내기':'전체 화면';
  });
})();
</script>
</body>
</html>
